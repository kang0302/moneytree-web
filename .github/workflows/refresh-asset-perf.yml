name: Refresh asset_perf (from import_MT px_hist)

on:
  workflow_dispatch: {}
  schedule:
    # 15:30 KST = 06:30 UTC (import_MT px_hist 06:00 UTC 갱신 이후)
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-asset-perf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout moneytree-web
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout import_MT (px_hist + ssot, public)
        uses: actions/checkout@v4
        with:
          repository: kang0302/import_MT
          ref: main
          path: import_MT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build asset_perf (구글식 캘린더 앵커, 조정가)
        run: |
          node scripts/build_asset_perf.mjs

      - name: Commit & push if changed
        run: |
          set -e
          if [ -z "$(git status --porcelain public/data/asset_perf)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "moneytree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/data/asset_perf
          git commit -m "chore(data): asset_perf 데일리 재빌드 (px_hist 최신 반영)"
          git push origin main
